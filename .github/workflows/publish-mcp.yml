name: MCP CI & Publish

on:
  push:
    branches: [main]
    paths:
      - "post-graph-rag-mcp/**"
      - "post_graph_rag/**"
      - "pyproject.toml"
      - "glama.json"
      - ".github/workflows/publish-mcp.yml"
    tags:
      - "mcp-v*"
  pull_request:
    paths:
      - "post-graph-rag-mcp/**"
      - "post_graph_rag/**"
      - "pyproject.toml"
      - "glama.json"
      - ".github/workflows/publish-mcp.yml"
  workflow_dispatch:

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/mcp-v') }}

jobs:
  test-mcp:
    name: MCP Tests (Python ${{ matrix.python }}, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pg: "16"
          - python: "3.12"
            pg: "16"
          - python: "3.13"
            pg: "18"

    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install core and MCP packages
        run: |
          python -m pip install --upgrade pip ruff pyyaml
          pip install -e ".[test]"
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pip install -e "./post-graph-rag-mcp[embedded,local-embed,test]"
          else
            pip install -e "./post-graph-rag-mcp[local-embed,test]"
          fi

      - name: Validate manifests and lint
        run: |
          python -c "
          import json, yaml
          for jf in ('glama.json', 'post-graph-rag-mcp/server.json'):
              with open(jf, 'r', encoding='utf-8') as f:
                  json.load(f)
          for yf in ('post-graph-rag-mcp/smithery.yaml', 'post-graph-rag-mcp/docker-compose.yml', '.github/workflows/publish-mcp.yml'):
              with open(yf, 'r', encoding='utf-8') as f:
                  yaml.safe_load(f)
          "
          ruff check post-graph-rag-mcp

      - name: Enable pgvector
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run MCP test suite and doctor
        env:
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/postgres
          POSTGRES_TEST_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pytest post-graph-rag-mcp/tests/ -q
          post-graph-rag-mcp doctor

      - name: Verify Tier-1 embedded Postgres bootstrap (Python 3.12)
        if: matrix.python == '3.12'
        env:
          MCP_PGDATA_DIR: ${{ runner.temp }}/mcp_embedded_pgdata
        run: |
          unset POSTGRES_URI DATABASE_URL RAG_DB_URI
          post-graph-rag-mcp doctor

      - name: Build Docker image smoke check
        if: matrix.python == '3.13' && matrix.pg == '18'
        run: docker build -f post-graph-rag-mcp/Dockerfile -t post-graph-rag-mcp:ci .

  publish-mcp:
    name: Build & Publish post-graph-rag-mcp to PyPI
    needs: [test-mcp]
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync MCP package and registry manifest version from tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          export VERSION="${TAG_NAME#mcp-v}"
          echo "MCP release version: ${VERSION}"

          python -c "
          import json, os, re
          ver = os.environ['VERSION']

          with open('post-graph-rag-mcp/pyproject.toml', 'r', encoding='utf-8') as f:
              pyproject = f.read()
          pyproject = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"{ver}\"', pyproject, count=1)
          with open('post-graph-rag-mcp/pyproject.toml', 'w', encoding='utf-8') as f:
              f.write(pyproject)

          with open('post-graph-rag-mcp/src/post_graph_rag_mcp/__init__.py', 'r', encoding='utf-8') as f:
              init_py = f.read()
          init_py = re.sub(r'__version__\s*=\s*\"[^\"]+\"', f'__version__ = \"{ver}\"', init_py, count=1)
          with open('post-graph-rag-mcp/src/post_graph_rag_mcp/__init__.py', 'w', encoding='utf-8') as f:
              f.write(init_py)

          with open('post-graph-rag-mcp/server.json', 'r', encoding='utf-8') as f:
              manifest = json.load(f)
          manifest['version'] = ver
          for pkg in manifest.get('packages', []):
              pkg['version'] = ver
          with open('post-graph-rag-mcp/server.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          "

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Build distribution artifacts
        working-directory: post-graph-rag-mcp
        run: uv build

      - name: Publish post-graph-rag-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: post-graph-rag-mcp/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
