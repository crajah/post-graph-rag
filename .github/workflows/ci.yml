name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The combinations a user is actually on, not a cross-product.
        #
        # 3.11 is the oldest Python still receiving security support and the
        # floor requires-python claims. PostgreSQL 16 is where most
        # deployments are; 18 is where the newest are, and it changed a
        # default that bears on this library directly --
        # `GENERATED ALWAYS AS (expr)` with no storage keyword used to be an
        # error and now means VIRTUAL, which cannot be indexed. A promoted
        # payload column exists only to carry an index, so that would make it
        # an expensive no-op on 18 alone. Hence a job on each.
        include:
          - python: "3.11"
            pg: "16"
          - python: "3.13"
            pg: "16"
          - python: "3.13"
            pg: "18"

    services:
      # The suite talks to a real PostgreSQL with pgvector rather than mocking
      # the database, because the behaviour under test -- generated columns,
      # JSONB predicates, vector search, cascades -- lives in the database.
      postgres:
        image: pgvector/pgvector:pg${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Enable pgvector
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        env:
          # No LLM credentials anywhere: every test uses the in-process fake,
          # so CI is free, offline and deterministic. A test that reaches the
          # network is a bug in the test.
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/postgres
          POSTGRES_TEST_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      # Lint only. Formatting is not enforced: applying a formatter to this
      # codebase would rewrite thousands of lines and lose the history behind
      # them, for no defect caught.
      - run: ruff check .
