name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    # Pinned per version rather than ubuntu-latest. On 2026-11-11 that label
    # rolled to Ubuntu 26.04, which actions/python-versions no longer builds
    # 3.9 for, and the job began failing in setup-python before a single test
    # ran -- on every commit, with nothing wrong in the tree. requires-python
    # still says >=3.9, so the floor keeps being tested on an image that has
    # it rather than being dropped because a runner label moved.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current. The middle versions rarely break
        # independently, and two jobs keep the feedback loop short.
        include:
          - python: "3.9"
            runner: ubuntu-22.04
          - python: "3.13"
            runner: ubuntu-latest

    services:
      # The suite talks to a real PostgreSQL with pgvector rather than mocking
      # the database, because the behaviour under test -- generated columns,
      # JSONB predicates, vector search, cascades -- lives in the database.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Enable pgvector
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        env:
          # No LLM credentials anywhere: every test uses the in-process fake,
          # so CI is free, offline and deterministic. A test that reaches the
          # network is a bug in the test.
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/postgres
          POSTGRES_TEST_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      # Lint only. Formatting is not enforced: applying a formatter to this
      # codebase would rewrite thousands of lines and lose the history behind
      # them, for no defect caught.
      - run: ruff check .
