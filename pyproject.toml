[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "post-graph-rag"
version = "1.4.0"
description = "Graph RAG library leveraging post-graph space sub-grouping and pgvector on PostgreSQL with OpenAI-compatible LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chandan Rajah", email = "chandan.rajah@gmail.com" }
]
keywords = ["graph-rag", "rag", "knowledge-graph", "post-graph", "pgvector", "llm", "openai"]
dependencies = [
    "post-graph>=0.6.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    # Leiden clustering for community detection. The library falls back to label
    # propagation without these, but the partitions are markedly worse, so it
    # ships by default rather than as an opt-in.
    "igraph>=0.11",
    "leidenalg>=0.10"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[project.urls]
Homepage = "https://github.com/crajah/post-graph-rag"
Repository = "https://github.com/crajah/post-graph-rag"
