[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "post-graph-rag"
version = "1.19.0"
description = "Graph RAG library leveraging post-graph space sub-grouping and pgvector on PostgreSQL with OpenAI-compatible LLMs."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chandan Rajah", email = "chandan.rajah@gmail.com" }
]
keywords = ["graph-rag", "rag", "knowledge-graph", "post-graph", "pgvector", "llm", "openai"]
# The licence classifier is what PyPI's search filters read; the `license`
# field above only drives what is displayed. The Python versions mirror
# requires-python, which is now the single version CI exercises.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "post-graph>=1.14.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    # Leiden clustering for community detection. The library falls back to label
    # propagation without these, but the partitions are markedly worse, so it
    # ships by default rather than as an opt-in.
    "igraph>=0.11",
    "leidenalg>=0.10"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[project.urls]
Homepage = "https://github.com/crajah/post-graph-rag"
Repository = "https://github.com/crajah/post-graph-rag"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["evaluation/lightrag_work", "evaluation/corpus", ".venv"]

[tool.ruff.lint]
# Deliberately narrow. These four catch real defects -- unused names, shadowed
# bindings, mutable defaults, loop-variable capture -- rather than enforcing a
# house style over a codebase that already has one. Style rules were left off
# because `ruff format` would rewrite ~6,000 lines and take git blame with it,
# which is a poor trade for a codebase whose formatting is already consistent.
select = ["F", "B", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# Scraping helpers, outside the shipped package.
"tables/**" = ["B905"]
# Research harnesses: closures inside a loop are consumed by an await in the
# same iteration, so the binding warning does not apply. Kept scoped to these
# files rather than disabled globally.
# Tests deliberately assert against broad exception types in a few places.
"tests/**" = ["B017", "B905"]
# B905: `zip(..., strict=)` became visible when target-version moved to
# py313; the rule does not exist below 3.10. It is not cosmetic. Several of
# these zips pair content with its embedding, and `strict=True` would turn a
# silent mispairing -- an entity carrying its neighbour's vector, which reads
# as subtly wrong retrieval and never as an error -- into a loud failure,
# which is what this codebase does everywhere else. So it is worth adopting,
# per site and on its own merits, not as part of a release about something
# else. Tracked rather than silently disabled, as B904 above.
"post_graph_rag/**" = ["B905"]
"evaluation/**" = ["B023", "B905"]
