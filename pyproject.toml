[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "post-graph-rag"
version = "1.12.0"
description = "Graph RAG library leveraging post-graph space sub-grouping and pgvector on PostgreSQL with OpenAI-compatible LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chandan Rajah", email = "chandan.rajah@gmail.com" }
]
keywords = ["graph-rag", "rag", "knowledge-graph", "post-graph", "pgvector", "llm", "openai"]
# The licence classifier is what PyPI's search filters read; the `license`
# field above only drives what is displayed. The Python versions mirror
# requires-python rather than the CI matrix, which exercises 3.11 alone.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "post-graph>=1.5.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    # Leiden clustering for community detection. The library falls back to label
    # propagation without these, but the partitions are markedly worse, so it
    # ships by default rather than as an opt-in.
    "igraph>=0.11",
    "leidenalg>=0.10"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[project.urls]
Homepage = "https://github.com/crajah/post-graph-rag"
Repository = "https://github.com/crajah/post-graph-rag"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["evaluation/lightrag_work", "evaluation/corpus", ".venv"]

[tool.ruff.lint]
# Deliberately narrow. These four catch real defects -- unused names, shadowed
# bindings, mutable defaults, loop-variable capture -- rather than enforcing a
# house style over a codebase that already has one. Style rules were left off
# because `ruff format` would rewrite ~6,000 lines and take git blame with it,
# which is a poor trade for a codebase whose formatting is already consistent.
select = ["F", "B", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# Research harnesses: closures inside a loop are consumed by an await in the
# same iteration, so the binding warning does not apply. Kept scoped to these
# files rather than disabled globally.
"evaluation/**" = ["B023"]
# Tests deliberately assert against broad exception types in a few places.
"tests/**" = ["B017"]
